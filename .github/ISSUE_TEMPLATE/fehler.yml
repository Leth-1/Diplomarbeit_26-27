name: Fehler
description: Etwas funktioniert nicht wie erwartet
title: "Fehler: "
labels: ["bug"]
body:
  - type: textarea
    id: was
    attributes:
      label: Was passiert?
    validations:
      required: true
  - type: textarea
    id: erwartet
    attributes:
      label: Was sollte passieren?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachstellen
      value: |
        1. 
        2. 
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Fehlermeldung, Screenshot, Branch
